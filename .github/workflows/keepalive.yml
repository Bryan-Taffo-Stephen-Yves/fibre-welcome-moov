# Garde le serveur de démonstration éveillé : un projet Supabase gratuit se met en pause après 7 jours sans visite.
# Tous les deux jours, une petite lecture (la même que celle de l'application) suffit à le garder actif pour le jury.
# La clé utilisée est la clé publique déjà présente dans src/ui/server-config.js.
name: Serveur éveillé

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lecture sur le serveur de démonstration
        run: |
          KEY=sb_publishable_HJjZVyrQSnJQHnWqfRamLQ_VwZwhmuH
          curl -fsS -X POST https://jmjdtpyiwgwdiuettoqy.supabase.co/rest/v1/rpc/fw_revs \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -d '{"p_paths":["fw/room/PING2345"]}'
